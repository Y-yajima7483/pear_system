# ==================================
# PEAR System - 本番用 Docker Compose（代替構成）
# ==================================
# このComposeをraw build/upしないこと。
# 必ず scripts/deploy.sh を入口とし、backup・単発migration・smoke gateを通す。
# ==================================

services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: pear_nginx
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./laravel/public:/var/www/app/public:ro
    depends_on:
      - next
      - php
    networks:
      - pear_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  next:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_URL: ${APP_ORIGIN:?APP_ORIGIN must be set}
    container_name: pear_next
    environment:
      - NODE_ENV=production
    networks:
      - pear_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile.prod
    container_name: pear_php
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:?APP_KEY must be set}
      - APP_ORIGIN=${APP_ORIGIN:?APP_ORIGIN must be set}
      - APP_URL=${APP_ORIGIN:?APP_ORIGIN must be set}
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=warning
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:?DB_DATABASE must be set}
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME must be set}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=cookie
      - SESSION_DOMAIN=${SESSION_DOMAIN:?SESSION_DOMAIN must be set}
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-true}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS must be set}
      - CORS_ALLOWED_ORIGINS=${APP_ORIGIN:?APP_ORIGIN must be set}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pear_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: pear_mysql
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:?DB_DATABASE must be set}
      - MYSQL_USER=${DB_USERNAME:?DB_USERNAME must be set}
      - MYSQL_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pear_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pear_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
