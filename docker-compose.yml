services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: pear_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./laravel:/var/www/app:ro
    depends_on:
      - next
      - php
    networks:
      - pear_network
    restart: unless-stopped

  next:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    container_name: pear_next
    volumes:
      - ./next:/app
      - next_node_modules:/app/node_modules
      - next_build_cache:/app/.next
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_APP_URL=http://localhost:${NGINX_PORT:-8080}
    expose:
      - "3000"
    networks:
      - pear_network
    restart: unless-stopped
    tty: true

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: pear_php
    volumes:
      - ./laravel:/var/www/app
    working_dir: /var/www/app
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-pear_db}
      - DB_USERNAME=${DB_USERNAME:-pear_user}
      - DB_PASSWORD=${DB_PASSWORD:-pear_pass}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pear_network
    restart: unless-stopped

  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: pear_mysql
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-pear_db}
      # 新規volumeの初回初期化時のみ作成されるPHPUnit専用DB。
      - MYSQL_CREATE_TEST_DATABASE=true
      - MYSQL_TEST_DATABASE=pear_system_testing
      - MYSQL_USER=${DB_USERNAME:-pear_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-pear_pass}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - pear_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  storybook:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    container_name: pear_storybook
    volumes:
      - ./next:/app
      - next_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    networks:
      - pear_network
    restart: unless-stopped
    tty: true
    command: ["yarn", "storybook"]
    profiles:
      - storybook

networks:
  pear_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  next_node_modules:
    driver: local
  next_build_cache:
    driver: local
