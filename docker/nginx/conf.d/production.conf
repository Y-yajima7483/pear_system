# ==================================
# PEAR System - nginx 本番設定（Docker代替構成）
# ==================================
# TLS終端は上流リバースプロキシで行う。
# ==================================

# レートリミット定義
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

map $http_x_forwarded_proto $effective_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# gzip圧縮
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 256;

server {
    listen 80;
    server_name _;

    # サーバーバージョン非表示
    server_tokens off;

    # アクセスログとエラーログ
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # セキュリティヘッダー（全レスポンスに適用）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Next.jsの静的ファイル（/_next/static/）
    location /_next/static/ {
        proxy_pass http://next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Next.jsの画像最適化API
    location /_next/image {
        proxy_pass http://next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # publicディレクトリの静的ファイル
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Next.js へのリバースプロキシ（ルート）
    location / {
        proxy_pass http://next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $effective_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60;
    }

    # ログインAPI（レートリミット強化）
    location = /api/login {
        limit_req zone=login burst=3 nodelay;

        root /var/www/app/public;
        try_files /index.php =404;

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO /login;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTP_X_FORWARDED_PROTO $effective_forwarded_proto;
        include fastcgi_params;
    }

    # Laravel API / Sanctum CSRF へのルーティング
    location ~ ^/(api|sanctum)(/.*)?$ {
        limit_req zone=api burst=20 nodelay;

        root /var/www/app/public;
        try_files /index.php =404;

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $2;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTP_X_FORWARDED_PROTO $effective_forwarded_proto;
        include fastcgi_params;
    }
}
